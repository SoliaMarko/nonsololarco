# Crowdin configuration for nonsololarco
# Docs: https://support.crowdin.com/developer/configuration-file/
#
# Credentials are injected via GitHub Actions secrets (CROWDIN_PROJECT_ID,
# CROWDIN_PERSONAL_TOKEN). Never commit them here.

"project_id_env": "CROWDIN_PROJECT_ID"
"api_token_env": "CROWDIN_PERSONAL_TOKEN"
"base_path": "."
"base_url": "https://api.crowdin.com"
"preserve_hierarchy": true

"files": [
  {
    "source": "/apps/web/messages/en/*.json",
    "translation": "/apps/web/messages/%two_letters_code%/%original_file_name%"
  }
]
