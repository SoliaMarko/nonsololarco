name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/types/**"

env:
  # `prisma generate` (packages/db's postinstall hook) needs this to resolve
  # even though this job never touches a real database.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nonsololarco?schema=public"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This workflow calls pnpm directly (not turbo), so turbo's ^build
      # dependency graph doesn't apply — @nonsololarco/db must be built
      # explicitly before api, since api's main now points at dist/.
      - run: pnpm --filter @nonsololarco/db build
      - run: pnpm --filter api build
      - run: pnpm --filter api lint
