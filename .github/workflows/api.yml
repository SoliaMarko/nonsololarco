name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/types/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - run: pnpm install
      - run: pnpm --filter api build
      - run: pnpm --filter api lint
