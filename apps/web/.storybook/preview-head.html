<!--
  next/font does not run in Storybook, so the `--font-*` variables that
  app/[locale]/layout.tsx normally emits are absent and every `font-label`
  / `font-prose` utility would fall back to the system face. Load the same
  families from Google Fonts and map the variables by hand.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;500;600&family=Space+Mono:wght@400;700&family=Spectral:wght@400;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --font-alfa-slab: 'Alfa Slab One';
    --font-oswald: 'Oswald';
    --font-space-mono: 'Space Mono';
    --font-spectral: 'Spectral';
  }
</style>
